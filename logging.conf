[loggers]
keys=root,app,edgefleet,uvicorn,uvicorn_error,uvicorn_access

[handlers]
keys=consoleHandlerRoot, consoleHandlerApp, fileHandler

[formatters]
keys=normalFormatter

[logger_root]
level=INFO
handlers=consoleHandlerRoot, fileHandler

[logger_app]
level=INFO
handlers=consoleHandlerApp, fileHandler
qualname=app
propagate=0

[logger_edgefleet]
level=INFO
handlers=consoleHandlerApp, fileHandler
qualname=edgefleet
propagate=0

[logger_uvicorn]
qualname=uvicorn
level=INFO
handlers=consoleHandlerRoot, fileHandler
propagate=0

[logger_uvicorn_error]
qualname=uvicorn.error
level=INFO
handlers=consoleHandlerRoot, fileHandler
propagate=0

[logger_uvicorn_access]
qualname=uvicorn.access
level=INFO
handlers=consoleHandlerRoot
propagate=0

[handler_consoleHandlerRoot]
class=StreamHandler
level=INFO
formatter=normalFormatter
args=(sys.stdout,)

[handler_consoleHandlerApp]
class=StreamHandler
level=INFO
formatter=normalFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=normalFormatter
args=('logs/app.log', 'a', 52428800, 10)

[formatter_normalFormatter]
format=%(asctime)s - %(levelname)s - %(name)s - %(message)s
