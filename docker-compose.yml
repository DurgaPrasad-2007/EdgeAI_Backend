services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: edgefleet-api:local
    container_name: edgefleet-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - EDGEFLEET_ENV=production
    env_file:
      - ./.env
    networks:
      - edgefleet-network

networks:
  edgefleet-network:
    name: edgefleet-net
