[loggers]
keys=root,app,edgefleet,uvicorn,uvicorn_error,uvicorn_access,sqlalchemy,asyncpg,aiosqlite,httpcore,httpx

[handlers]
keys=consoleHandlerRoot, consoleHandlerApp, fileHandler

[formatters]
keys=normalFormatter, verboseFormatter

[logger_root]
level=INFO
handlers=consoleHandlerRoot, fileHandler

[logger_app]
level=DEBUG
handlers=consoleHandlerApp, fileHandler
qualname=app
propagate=0

[logger_edgefleet]
level=DEBUG
handlers=consoleHandlerApp, fileHandler
qualname=edgefleet
propagate=0

[logger_uvicorn]
qualname=uvicorn
level=INFO
handlers=consoleHandlerRoot, fileHandler
propagate=0

[logger_uvicorn_error]
qualname=uvicorn.error
level=INFO
handlers=consoleHandlerRoot, fileHandler
propagate=0

[logger_uvicorn_access]
qualname=uvicorn.access
level=INFO
handlers=consoleHandlerRoot
propagate=0

[logger_sqlalchemy]
qualname=sqlalchemy.engine
level=WARNING
handlers=consoleHandlerRoot, fileHandler
propagate=0

[logger_asyncpg]
qualname=asyncpg
level=WARNING
handlers=consoleHandlerRoot, fileHandler
propagate=0

[logger_aiosqlite]
qualname=aiosqlite
level=WARNING
handlers=consoleHandlerRoot, fileHandler
propagate=0

[logger_httpcore]
qualname=httpcore
level=WARNING
handlers=consoleHandlerRoot, fileHandler
propagate=0

[logger_httpx]
qualname=httpx
level=WARNING
handlers=consoleHandlerRoot, fileHandler
propagate=0

[handler_consoleHandlerRoot]
class=StreamHandler
level=DEBUG
formatter=%(active_formatter)s
args=(sys.stdout,)

[handler_consoleHandlerApp]
class=StreamHandler
level=DEBUG
formatter=%(active_formatter)s
args=(sys.stdout,)

[handler_fileHandler]
class=handlers.RotatingFileHandler
level=DEBUG
formatter=%(active_formatter)s
args=('logs/app.log', 'a', 52428800, 10)

[formatter_normalFormatter]
format=%(asctime)s - %(levelname)s - %(name)s - %(message)s

[formatter_verboseFormatter]
format=%(asctime)s loglevel=%(levelname)-6s logger=%(name)s %(process)d : %(pathname)s %(funcName)s() L%(lineno)-4d %(message)s
